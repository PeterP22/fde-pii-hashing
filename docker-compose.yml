services:
  capture:
    image: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
    init: true
    command: ["python", "/app/capture_upstream.py", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - ./tools/capture_upstream.py:/app/capture_upstream.py:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  presidio-analyzer:
    image: ghcr.io/data-privacy-stack/presidio-analyzer:2.2.363@sha256:330c78c144eca0c554e4cf12ab7c05a21872dca63fe6f93d67f08741de30b62f
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:3000/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  presidio-anonymizer:
    image: ghcr.io/data-privacy-stack/presidio-anonymizer:2.2.363@sha256:91e4126c87e8246a0f3f5df3b732c0c2326fa0529d0a26e48dc0897c62425c04
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:3000/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  litellm:
    image: ghcr.io/berriai/litellm:v1.92.0@sha256:9ef6f45bc0104940571765e610c52a1d761b5ec85efcd193795281086ee61277
    init: true
    command: ["--config", "/app/config/litellm.yaml", "--host", "0.0.0.0", "--port", "4000"]
    volumes:
      - ./config/litellm.yaml:/app/config/litellm.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      capture:
        condition: service_healthy
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    security_opt:
      - no-new-privileges:true
