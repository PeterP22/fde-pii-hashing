[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fde-pii-hashing"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "presidio-analyzer==2.2.363",
  "presidio-anonymizer==2.2.363",
  "pydantic>=2.12.5,<3",
  "python-dotenv>=1.2.2,<2",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = [
  "mypy>=2.3.0,<3",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.uv]
# GHSA-537c-gmf6-5ccf: this hash/mask-only lab smoke-tests Presidio with the patched release.
override-dependencies = ["cryptography>=48.0.1,<49"]

[tool.hatch.build.targets.wheel]
packages = ["src/fde_privacy"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
markers = ["integration: requires local Docker services"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["fde_privacy"]
